name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regra de ouro (cada equipe na sua pasta)
        if: github.event_name == 'pull_request'
        run: node scripts/confere-pasta.mjs "${{ github.head_ref }}" "origin/${{ github.base_ref }}"
      - run: npm run confere
      - run: npm run lint
      - run: npm test
      - run: npm run build
